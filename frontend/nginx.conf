server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploaded CSVs / bulk imports can be a few hundred KB.
    client_max_body_size 10m;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Server-Sent Events stream. Buffering MUST be off, otherwise nginx holds
    # the response and the dashboard never receives live updates. The read
    # timeout must also outlive the 30s keep-alive broadcast in app.ts.
    location /api/events {
        proxy_pass              http://backend:3001;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        '';
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding off;
        proxy_read_timeout      24h;
        proxy_send_timeout      24h;
    }

    # Everything else under /api goes to the backend as a normal request.
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend health probe, handy for the start script.
    location = /health {
        proxy_pass       http://backend:3001/health;
        proxy_set_header Host $host;
    }

    # Vue Router uses HTML5 history mode: unknown paths must return index.html
    # so deep links like /teams/3 work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
