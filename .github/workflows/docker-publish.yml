name: Publish Docker images

# Builds and pushes the db/backend/frontend images to GitHub Container
# Registry so anyone can run HMHMS with `docker compose pull && docker
# compose up -d` (see COMPLETE-SETUP-GUIDE.md) without cloning this repo.
# The db image bakes in mysql-schema.sql at build time - a plain
# mariadb:10.11 image plus a host bind-mount for the schema file only works
# from a full source checkout, not this no-checkout flow.
#
# Uses the automatically-provided GITHUB_TOKEN (via permissions.packages:
# write below) — no manual secrets to configure. New packages default to
# private on first publish; make ghcr.io/ryantyk/hmhms-db,
# ghcr.io/ryantyk/hmhms-backend and ghcr.io/ryantyk/hmhms-frontend public
# once under each package's Settings -> Danger Zone -> Change visibility.

on:
  push:
    branches: [local-only]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: db
            context: ./backend
            dockerfile: ./backend/db.Dockerfile
            image: ghcr.io/ryantyk/hmhms-db
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/ryantyk/hmhms-backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/ryantyk/hmhms-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
