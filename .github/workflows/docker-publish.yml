name: Publish Docker images

# Builds and pushes the backend/frontend images to Docker Hub so anyone can
# run HMHMS with `docker compose pull && docker compose up -d` (see
# COMPLETE-SETUP-GUIDE.md) without cloning this repo.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not your account password).

on:
  push:
    branches: [local-only]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ryantyk/hmhms-backend
          - name: frontend
            context: ./frontend
            image: ryantyk/hmhms-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
